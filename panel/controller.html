<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2026%2024%22%20fill%3D%22none%22%20stroke%3D%22%23ff6fc4%22%20stroke-width%3D%221.8%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20role%3D%22img%22%20aria-label%3D%22meowmarism%22%3E%3Cpath%20d%3D%22M3.2%204.7%20C3.2%203.29%204.82%202.5%205.94%203.36%20L13%208.83%20L20.06%203.36%20C21.18%202.5%2022.8%203.29%2022.8%204.7%20L22.8%2018.4%20C22.8%2020.58%2020.28%2021.79%2018.57%2020.42%20L13%2015.96%20L7.43%2020.42%20C5.72%2021.79%203.2%2020.58%203.2%2018.4%20Z%22%2F%3E%3Cpath%20d%3D%22M12.08%2014.59%20C12.08%2014.26%2012.35%2014.06%2012.74%2014.06%20H13.26%20C13.65%2014.06%2013.92%2014.26%2013.92%2014.59%20C13.92%2014.85%2013.79%2015.04%2013.59%2015.24%20L13%2015.83%20L12.41%2015.24%20C12.21%2015.04%2012.08%2014.85%2012.08%2014.59%20Z%22%20fill%3D%22%23ff6fc4%22%20stroke%3D%22none%22%2F%3E%3Cpath%20d%3D%22M6.3%2012.7%20L9.6%2013.7%22%20stroke-width%3D%221.3%22%2F%3E%3Cpath%20d%3D%22M6.3%2015.5%20L9.6%2014.9%22%20stroke-width%3D%221.3%22%2F%3E%3Cpath%20d%3D%22M19.7%2012.7%20L16.4%2013.7%22%20stroke-width%3D%221.3%22%2F%3E%3Cpath%20d%3D%22M19.7%2015.5%20L16.4%2014.9%22%20stroke-width%3D%221.3%22%2F%3E%3C%2Fsvg%3E">
<title>meowmarism LITE</title>
<link rel="stylesheet" href="/core/tokens/tokens.css">
<link rel="stylesheet" href="/core/ui/base.css">
<link rel="stylesheet" href="/core/ui/sidebar.css">
<link rel="stylesheet" href="/core/ui/users-ui.css">
<link rel="stylesheet" href="/core/ui/modpack-ui.css">
<script src="/i18n.js"></script>
<script src="/core/ui/loaders.js"></script>
<script src="/core/ui/instances-ui.js"></script>
<script src="/core/ui/system-ui.js"></script>
<script src="/core/ui/shell.js"></script>
<script src="/core/ui/wizard-ui.js"></script>
<script src="/core/ui/modpack-ui.js"></script>
<script src="/core/ui/users-ui.js"></script>
</head>
<body>


<div class="main">
<div class="wrap">
<div class="http-warn" id="httpWarn">This panel is reached over plain HTTP on a public address, so passwords and sessions can be intercepted. Put it behind HTTPS (see the README).</div>

  <section class="page active" id="page-server">
    <div class="topbar">
      <div>
        <h1><span class="wordmark">meowmarism</span> <span class="edition">LITE</span></h1>
        <p class="sub">Instances on this host - each one is its own process with its own console, stats and backups.</p>
      </div>
      <button class="addbtn" id="openWizard" title="Create instance" aria-label="Create instance">+</button>
    </div>

    <div class="inst-summary" id="instSummary"></div>
    <div class="inst-grid" id="instGrid"></div>
  </section>

  <section class="page" id="page-users"><div id="usersRoot"></div></section>

</div>
</div>


<div class="modal-back" id="modalBack">
  <div class="modal">
    <div class="modal-title" id="modalTitle"></div>
    <p class="modal-msg" id="modalMsg"></p>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>


<script>
const $ = (id) => document.getElementById(id);
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// --- shared modal, replaces every alert()/confirm() in this page ---
function showModal(title, message, buttons) {
  return new Promise((resolve) => {
    $('modalTitle').textContent = title;
    $('modalMsg').textContent = message;
    const actions = $('modalActions');
    actions.innerHTML = '';
    const close = (value) => { $('modalBack').classList.remove('open'); resolve(value); };
    buttons.forEach((b) => {
      const btn = document.createElement('button');
      btn.className = `btn${b.primary ? ' primary' : ''}`;
      btn.textContent = b.label;
      btn.addEventListener('click', () => close(b.value));
      actions.appendChild(btn);
    });
    $('modalBack').classList.add('open');
  });
}
function modalAlert(title, message) {
  return showModal(title, message, [{ label: 'OK', value: true, primary: true }]);
}
function modalConfirm(title, message, confirmLabel = 'Confirm') {
  return showModal(title, message, [
    { label: 'Cancel', value: false },
    { label: confirmLabel, value: true, primary: true },
  ]);
}

(function () {
  const h = location.hostname;
  const local = /^(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|169\.254\.|\[?::1\]?$|\[?f[cd])/i.test(h) || h.endsWith('.local') || h.endsWith('.lan') || !h.includes('.');
  if (location.protocol === 'http:' && !local) document.getElementById('httpWarn').style.display = 'block';
})();

// --- panel frame (sidebar, Settings, Update) ---
const SHELL = MeowShell.mount({
  edition: 'LITE',
  repo: 'meowmarism-official/meowmarism-lite',
  serverLabel: 'Server',
  brandSub: 'Official version',
  logoutHref: '/auth/logout',
  updateHint: 'Updating stops running servers briefly, installs the newest release, and starts the ones that were running again.',
  paths: { server: '/server', users: '/users', settings: '/settings', system: '/system', update: '/update' },
  urls: { version: '/api/version', update: '/api/update', updateStatus: '/api/update-status', settings: '/api/settings', system: '/api/system-info' },
  t: window.t, esc,
  confirm: (title, message, label) => modalConfirm(title, message, label),
  pagesEl: document.querySelector('.wrap'),
  onPage: (page) => { if (page === 'users') loadUsers(); },
});
const { showPage, pageFromPath } = SHELL;
let currentRole = null;

function healthDot(i) {
  if (i.health === 'error') return 'err';
  if (i.health === 'running') return 'on';
  if (i.health === 'panel-off' || i.health === 'stopped') return 'off';
  return 'mid'; // starting/unknown
}
function healthLabel(i) {
  if (i.health === 'error') return 'error';
  if (i.health === 'running') return 'running';
  if (i.health === 'panel-off') return 'panel not started';
  if (i.health === 'starting') return 'starting';
  return i.health || 'stopped';
}

let hostMemMB = 0;
let modpacksOn = false;
function instCard(i) {
  return {
    name: i.name, loader: i.loader, loaderVersion: i.loaderVersion, mcVersion: i.mcVersion, port: i.port, running: i.running,
    pill: { dot: healthDot(i), label: healthLabel(i) }, cpuPercent: i.cpuPercent, rssMB: i.rssMB,
    error: i.health === 'error' && i.crash?.reason ? i.crash.reason : '',
    canOpen: i.health !== 'panel-off', canManage: i.caps.includes('power'), openAttr: `href="/instance/${encodeURIComponent(i.name)}/"`,
  };
}
async function loadInstances() {
  const r = await fetch('/api/instances');
  const data = await r.json();
  $('openWizard').style.display = data.canCreate ? '' : 'none';
  hostMemMB = data.hostMemMB || 0;
  modpacksOn = !!data.modpacks;
  MeowInstances.render($('instGrid'), $('instSummary'), data.instances.map(instCard), hostMemMB, 'No instances yet - create your first server with the + button.');
}

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const { act, id } = btn.dataset;
  if (act === 'stop' || act === 'restart') {
    const stopping = act === 'stop';
    const ok = await modalConfirm(stopping ? 'Stop this server?' : 'Restart this server?', 'Players will be disconnected' + (stopping ? ' and the world is saved.' : ' while it restarts.'), stopping ? 'Stop' : 'Restart');
    if (!ok) return;
  }
  btn.disabled = true;
  try {
    await fetch(`/api/instances/${id}/${act}`, { method: 'POST' });
  } finally {
    setTimeout(loadInstances, 800);
  }
});

async function loadMcVersions(loader) {
  const sel = $('w-mc');
  sel.innerHTML = '<option value="">Loading...</option>';
  const r = await fetch(`/api/loader-versions?loader=${encodeURIComponent(loader)}`);
  const data = await r.json();
  sel.innerHTML = data.mcVersions.map((v) => `<option value="${v}">${v}</option>`).join('');
  if (data.mcVersions.length) loadLoaderVersions(loader, data.mcVersions[0]);
}
async function loadLoaderVersions(loader, mc) {
  const sel = $('w-loaderVersion');
  const noLoaderVersion = ['vanilla', 'paper', 'purpur'].includes(loader);
  $('w-loaderVersionField').style.display = noLoaderVersion ? 'none' : '';
  if (noLoaderVersion) { sel.disabled = true; sel.innerHTML = '<option value="">(not needed)</option>'; return; }
  sel.disabled = true; sel.innerHTML = '<option value="">Loading...</option>';
  const r = await fetch(`/api/loader-versions?loader=${encodeURIComponent(loader)}&mc=${encodeURIComponent(mc)}`);
  const data = await r.json();
  const versions = Array.isArray(data) ? data : data.versions;
  sel.innerHTML = (versions || []).map((v) => `<option value="${v}">${v}</option>`).join('') || '<option value="">none found</option>';
  sel.disabled = false;
}
async function suggestPort(start) {
  try {
    const d = await (await fetch(`/api/free-port?start=${encodeURIComponent(start)}`)).json();
    $('w-port').value = d.port;
    $('w-portHint').textContent = d.taken ? window.t(`Port ${start} is in use, ${d.port} is free.`) : '';
  } catch (_) {}
}

// --- create wizard ---
function fieldError(id, msg) { const el = $(id); if (!msg) { el.style.display = 'none'; el.textContent = ''; return false; } el.textContent = msg; el.style.display = ''; return true; }
const WIZ = MeowWizard.mount({
  t: window.t, esc,
  createLabel: 'Create instance',
  steps: [
    { title: 'Create instance', hint: 'Start from scratch or from a modpack.', html: '<div id="w-source"></div>', when: () => modpacksOn },
    { title: 'Create instance', hint: 'Name it and pick what it runs.', when: () => !modpacksOn || SOURCE.mode() === 'blank', html: `      <div class="field"><label for="w-name">Instance name</label><input id="w-name" placeholder="survival-2"></div>
      <div class="field-row">
        <div class="field"><label for="w-loader">Loader</label>
          <select id="w-loader">
            <option value="vanilla" selected>Vanilla</option>
            <option value="paper">Paper</option>
            <option value="purpur">Purpur</option>
            <option value="fabric">Fabric</option>
            <option value="forge">Forge</option>
            <option value="neoforge">NeoForge</option>
          </select>
        </div>
        <div class="field"><label for="w-mc">Minecraft version</label><select id="w-mc"><option value="">Loading...</option></select></div>
      </div>
      <div class="field" id="w-loaderVersionField"><label for="w-loaderVersion">Loader version</label><select id="w-loaderVersion" disabled><option value="">Pick a Minecraft version first</option></select></div>`,
      validate: () => {
        if (!$('w-name').value.trim()) return 'Pick an instance name';
        if (!$('w-mc').value) return 'Pick a Minecraft version';
        if ($('w-loader').value !== 'vanilla' && !$('w-loaderVersion').value) return 'Pick a loader version';
        return null;
      } },
    { title: 'Modpack', hint: 'Search Modrinth and pick a version.', html: '<div id="w-modpack"></div>', when: () => modpacksOn && SOURCE.mode() === 'modpack', validate: () => PICKER.validate() },
    { title: 'Resources', hint: 'How much of this machine the instance may use.', onShow: () => { const p = modpackMode() && PICKER.value(); if (p) $('w-ram').value = p.ramMB; }, html: `      <div class="field-row">
        <div class="field"><label for="w-port">Server port</label><input id="w-port" type="number" value="25565"><div class="hint" id="w-portHint" style="margin-top:4px"></div></div>
        <div class="field"><label for="w-ram">Memory (MB)</label><input id="w-ram" type="number" value="4096" step="512" min="1024" max="32768"></div>
      </div>
      <p class="hint" style="margin-top:-6px">Handed to the JVM as -Xmx. Leave headroom for the OS and other instances on this host.</p>
      <label class="toggle-row" style="margin-top:10px"><span class="toggle"><input type="checkbox" id="w-autostart" /><span class="toggle-track"></span><span class="toggle-thumb"></span></span><span>Start automatically when meowmarism starts</span></label>`,
      validate: () => {
        const port = Number($('w-port').value);
        const ram = Number($('w-ram').value);
        if (!Number.isInteger(port) || port < 1 || port > 65535) return 'Enter a valid port (1-65535)';
        if (!ram || ram < 1024) return 'Give it at least 1024 MB';
        return null;
      } },
    { title: 'Backups', hint: 'Automatic world backups for this instance.', html: `      <div class="field-row">
        <div class="field"><label for="w-backupInterval">Every (hours)</label><input id="w-backupInterval" type="number" value="6" min="1" max="168"></div>
        <div class="field"><label for="w-maxBackups">Keep at most</label><input id="w-maxBackups" type="number" value="10" min="1" max="100"></div>
      </div>` },
  ],
  onOpen: () => { suggestPort(25565); if ($('w-mc').options.length <= 1) loadMcVersions($('w-loader').value); },
  create: async () => {
    const pack = modpackMode() ? PICKER.value() : null;
    const body = {
      name: pack ? pack.name : $('w-name').value.trim(), loader: $('w-loader').value, mcVersion: $('w-mc').value, loaderVersion: $('w-loaderVersion').value,
      ...(pack ? { modpack: { versionId: pack.versionId } } : {}),
      port: Number($('w-port').value), ramMB: Number($('w-ram').value),
      backupIntervalHours: Number($('w-backupInterval').value), maxBackups: Number($('w-maxBackups').value), autoStart: $('w-autostart').checked,
    };
    const r = await fetch('/api/instances', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Failed to create');
    return body.name;
  },
  progress: async () => (await fetch('/api/create-log')).json(),
  openHref: (name) => `/instance/${encodeURIComponent(name)}/`,
  onFinished: () => { $('w-name').value = ''; loadInstances(); },
});
const modpackMode = () => modpacksOn && SOURCE.mode() === 'modpack';
const SOURCE = MeowModpack.mountSource({ el: $('w-source'), t: window.t, esc, onChange: () => { WIZ.refresh(); if (modpackMode()) PICKER.reset(); } });
async function modpackJson(url) {
  const r = await fetch(url);
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'Request failed');
  return d;
}
const PICKER = MeowModpack.mountPicker({
  el: $('w-modpack'), t: window.t, esc,
  loaders: ['fabric', 'forge', 'neoforge'],
  maxRamMB: () => hostMemMB,
  api: {
    search: ({ query, offset }) => modpackJson(`/api/modpacks/search?query=${encodeURIComponent(query)}&offset=${offset}`),
    versions: (id) => modpackJson(`/api/modpacks/${encodeURIComponent(id)}/versions`),
    preview: (versionId) => modpackJson(`/api/modpacks/versions/${encodeURIComponent(versionId)}/preview`),
  },
});
$('w-port').addEventListener('change', (e) => suggestPort(Number(e.target.value) || 25565));
$('w-loader').addEventListener('change', (e) => loadMcVersions(e.target.value));
$('w-mc').addEventListener('change', (e) => { if (e.target.value) loadLoaderVersions($('w-loader').value, e.target.value); });
$('openWizard').addEventListener('click', () => WIZ.open());

// --- account / users ---
async function loadAccount() {
  const s = await (await fetch('/auth/status')).json();
  currentRole = s.role;
  currentPanel = s.panel || {};
  SHELL.setAccount({ username: s.username, role: s.role, loggedIn: s.loggedIn }, currentPanel);
}
let currentPanel = {};
const USERS = MeowUsers.mount({
  el: $('usersRoot'),
  base: '/api/users',
  instances: async () => { const r = await fetch('/api/instances'); return r.ok ? (await r.json()).instances.map((i) => i.name) : []; },
  role: () => currentRole,
  t: window.t, esc,
  toast: (m) => modalAlert('Error', m),
  confirm: (title, message, label) => modalConfirm(title, message, label),
});
const loadUsers = () => USERS.load();

loadInstances();
loadAccount().then(() => showPage(pageFromPath(), { push: false }));
setInterval(loadInstances, 5000);
</script>
</body>
</html>
